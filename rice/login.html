<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>利芳米行</title>
    <link rel="stylesheet" href="all.css">
    <script src="https://kit.fontawesome.com/d3539c708b.js" crossorigin="anonymous"></script>
    <script src="jquery-3.6.0.min.js"></script>
    <script src="jslib.js"></script>
    <script>
        var flag = 0;
        function showEye() {
            if (flag == 0) {
                document.getElementById("pw").type = "text";
                document.getElementById("eye").className = "far fa-eye-slash";
                flag = 1;
            } else {
                document.getElementById("pw").type = "password";
                document.getElementById("eye").className = "far fa-eye";
                flag = 0;
            }
        }
    </script>
</head>

<body in=login>
    <div style="height: 25px;"></div>
    <nav style="text-align: left;font-size: 20px;">
        <include src="nav.html"></include>
    </nav>
    <script src="https://cdn.lordicon.com/libs/mssddfmo/lord-icon-2.1.0.js"></script>
    <h1 style="font-weight: bold;margin-right: 30px;">
        <lord-icon src="https://cdn.lordicon.com/dxjqoygy.json" trigger="hover"
            colors="primary:#121331,secondary:#FFE153" style="width:90px;height:90px">
        </lord-icon>Login
    </h1>
    <div style="height:10px"></div>
    <div class="main">
        <p>帳號<br>
            <input type="text" name="account" class="borderBottom" style="margin-top: 10px;" size="26" required>
        </p>
        <br>
        <p>密碼<br>
            <input type="password" name="password" style="border:2px solid; margin-left:26px ;margin-top: 10px;" id="pw"
                name="password" size="26" required>
            <i class="far fa-eye" id="eye" onclick="showEye()"></i>
        </p>
        <br>
        <p><button class="btn"
                style="width: 100px;height: 30px;cursor: pointer;background-color: #f8edb7;color:black;font-weight: bold;font-size:18px;">登入</button>
        </p>
        <button id="forgetBtn">忘記密碼</button>
        </p>
    </div>
    <div style="height:20px"></div>
    <div id="footer">
        <p style="font-size:14px;">未註冊過，按下按鈕成為我們的新會員<br></p>
        <button class="btn" style="width: 200px;font-size:14px;">CREATE NEW ACCOUNT</button>
    </div>
</body>

</html>
