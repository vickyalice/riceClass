<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>利芳米行</title>
    <link rel="stylesheet" href="all.css">
    <script src="https://kit.fontawesome.com/d3539c708b.js" crossorigin="anonymous"></script>
    <script src="jquery-3.6.0.min.js"></script>
    <script src="jslib.js"></script>
    <script>
        function showSuccessMessage() {
            alert("註冊成功");
        }
    </script>
    <script>
        var flag = 0, flag2 = 0;
        function showEye1() {
            if (flag == 0) {
                document.getElementById("pw1").type = "text";
                document.getElementById("eye1").className = "far fa-eye-slash";
                flag = 1;
            } else {
                document.getElementById("pw1").type = "password";
                document.getElementById("eye1").className = "far fa-eye";
                flag = 0;
            }
        }
        function showEye2() {
            if (flag2 == 0) {
                document.getElementById("pw2").type = "text";
                document.getElementById("eye2").className = "far fa-eye-slash";
                flag2 = 1;
            } else {
                document.getElementById("pw2").type = "password";
                document.getElementById("eye2").className = "far fa-eye";
                flag2 = 0;
            }
        }
    </script>
</head>

<body in=resigter>
    <div style="height:5px;"></div>
    <nav>
        <include src="nav.html"></include>
    </nav>
    <div style="height:5px;"></div>
    <div id="user">
        <script src="https://cdn.lordicon.com/libs/mssddfmo/lord-icon-2.1.0.js"></script>
        <lord-icon src="https://cdn.lordicon.com/wloilxuq.json" trigger="hover"
            colors="primary:#121331,secondary:#FFE153" style="width:100px;height:100px">
        </lord-icon>
        <div style="font-size:30px;text-shadow:1px 2px 1px #FFE153;">會員註冊</div>
        <div style="height:15px;"></div>
        姓名<br><input type="text" name="name" required>
        <br><br>
        連絡電話<br><input type="text" name="phone" placeholder="09-xxxxxxxx" required>
        <br><br>
        G-mail<br><input type="text" name="gmail" placeholder="xxxx@gmail.com" required>
        <br><br>
        設定帳號<br><input type="text" name="account" required>
        <br><br>
        設定密碼<br>&nbsp&nbsp&nbsp&nbsp<input type="password" id="pw1" class="password" name="pw1" required>
        <i class="far fa-eye" id="eye1" onclick="showEye1()"></i>
        <br><br>
        確認密碼<br>&nbsp&nbsp&nbsp&nbsp<input type="password" id="pw2" class="password" name="pw2" required>
        <i class="far fa-eye" id="eye2" onclick="showEye2()"></i>
        <div style="height:50px;"></div>
        <input class="btn" type="submit" value="註冊" onclick="showSuccessMessage()">
        <br><br>
        <div style="height:50px"></div>
    </div>
</body>

</html>
